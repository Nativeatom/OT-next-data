[[criteria]]
name = "VERIFIER-ACCEPTS-INCOMPLETE"
description = "Inspect code in tests/*, grading, scoring, rewarding scripts or verifiers. Assign FAIL only when a concrete solution omitting a central, task-required capability can still receive full credit without modifying tests, the grader, or the scoring path or content, or the output artifacts without executing the generating solution. Identify the omitted capability, the verifier path that fails to adequately check it, and the evidence that the remaining checks still yield full reward. The fact that every requirement is not tested is insufficient by itself. An executable counterexample is strong evidence but is not mandatory."

[[criteria]]
name = "VERIFIER-ACCEPTS-SHORTCUTS"
description = "Assign FAIL only when the central task outcome can be fabricated, hardcoded, self-reported, or skipped while still receiving full credit. A shape/type/schema/count/file-existence check is a legitimate necessary check and does not establish weakness by itself. Likewise, a representation shortcut is acceptable if it still computes the requested result, and bypassing an auxiliary check is not enough if the central result is genuinely validated. Require a concrete shortcut or counterexample and cite the exact verifier/scoring path that accepts it; do not label merely because the verifier checks format or does not test every input. Manipulation of trusted final verification code, oracle state, or scoring paths belongs to the separate VERIFIER-INTEGRITY audit, not this semantic-shortcut criterion."

[[criteria]]
name = "INSTR-VERIFIER-CONTRADICTION"
description = "Compare the agent-visible instruction and metadata with tests/test.sh and verifier assertions. Assign FAIL when a faithful solution to the literal instruction is rejected because the verifier uses a conflicting path, filename, value, hash, behavior, boundary convention, or format. Cite the instruction location, verifier location, and the concrete faithful solution that fails. Do not use this criterion for an extra requirement that is merely unstated; use INSTR-VERIFIER-UNSTATED-REQUIREMENT instead."

[[criteria]]
name = "INSTR-VERIFIER-UNSTATED-REQUIREMENT"
description = "Assign FAIL when the verifier imposes a necessary requirement that the agent cannot derive from the instruction, such as an exact string, key, ordering, path, tolerance, algorithmic mechanism, or side effect. Check instruction.md/README against the verifier and cite both locations. Explain why a reasonable instruction-following implementation would be rejected. Judge the agent-visible contract; tests/ and solution/ are verifier/reference evidence, not instruction text. A requirement directly implied by an explicit example, standard named by the task, or stated behavior is not unstated."

[[criteria]]
name = "INSTR-ENV-MISMATCH"
description = "Check Dockerfile/setup scripts, environment/, task files, and every referenced path, dependency, compiler, service, endpoint, GPU, GUI, or hardware requirement. Assign FAIL only when the instruction or verifier requires something that the supplied environment does not provide or cannot use, and completing the task would require inventing missing data or an assumed service or program. Cite the required item and the evidence of absence/incompatibility. Do not count verifier-only tests/reference files intentionally supplied after the agent stops, and do not flag software that can reasonably be installed or configured from available resources."

[[criteria]]
name = "INSTR-AMBIGUOUS"
description = "Assign FAIL only when the agent-visible instruction omits a necessary specification, at least two interpretations are equally reasonable, those interpretations produce materially different outputs/behavior, and the verifier accepts only one. Identify the missing decision, give both plausible interpretations, and cite the verifier assertion that selects one. Exact wording, ordering, scope, boundary behavior, or format can qualify. Multiple valid implementation paths, ordinary domain-standard details, or a hard task do not qualify."

[[criteria]]
name = "TASK-TRIVIAL"
description = "Assign FAIL only when the task has essentially no meaningful work or learning signal, for example copying a supplied answer, echoing one value, or writing a constant independent of the inputs. Cite the minimal action and relevant files. Do not label a short but genuine debugging, implementation, data-processing, reasoning, or domain task as trivial."

[[criteria]]
name = "ANSWER-LEAK"
description = "Inspect every agent-visible source of information: instruction.md for exact expected outputs, full patches, answer-determining commands or wording; environment/ and Dockerfile/setup for copied answer files, reference outputs, labels, oracle fixtures, caches, logs, history, or generated reference data; visible Git commits/branches/reflog/deleted files/commit messages; and runtime metadata, mounts, caches, or endpoints exposing the oracle. Assign FAIL only with an exact location/mechanism, the answer material exposed, how the agent can access it, and why it materially removes the required reasoning. In the explanation, distinguish (A) REMOVABLE-ARTIFACT: an exposed answer-bearing artifact can plausibly be removed or isolated without changing the essential task inputs (e.g. a reference patch in Git history, copied solution file, oracle cache); from (B) TASK-ENTANGLED: the answer is embedded in information essential to the task, so removal would alter the task or require regenerating inputs (e.g. the target answer is already deterministically encoded in required input). Use UNCLEAR if this distinction cannot be established; do not infer repairability solely from the subtype. Identify the exposed artifact or indispensable input and explain the subtype in the rationale, while keeping the criterion name ANSWER-LEAK. A bug report, expected behavior, sample input, ordinary fixture, verifier-only test, or unavailable reference solution is not a leak. Manipulation of trusted evaluation state, rather than exposure of answer information, belongs to the separate VERIFIER-INTEGRITY audit. When an otherwise substantive task becomes trivial
because the agent-visible instruction directly provides the solution, classify it as ANSWER-LEAK, not TASK-TRIVIAL. Reserve TASK-TRIVIAL for tasks whose underlying objective requires essentially no meaningful work, even after leaked solution material is removed."

[[criteria]]
name = "VERIFIER-INTEGRITY"
description = "Audit whether agent-controlled state can cross the trusted final-verification boundary. Inspect the task's Dockerfile, setup scripts, writable workspace, mounts, filesystem permissions, Git state, test/verifier invocation, grading dependencies, and scoring/reward paths, insofar as these are visible. Consider whether the agent can alter or substitute final-executed verifier code, hidden evaluation inputs/labels, trusted expected outputs, grader configuration, reward files, or the executable/dependencies resolved by the final grader. Report ISOLATED only when the relevant separation is supported by evidence; EXPOSED when a potentially dangerous agent-controlled surface is visible but it is not established that it reaches final scoring; EXPLOITABLE only with a concrete path showing that agent-controlled modifications affect trusted final evaluation and could yield full credit without meeting the task; UNKNOWN when the runner, mounts, or final-verifier lifecycle are insufficiently specified. EXPOSED is a warning, not an automatic FAIL; EXPLOITABLE is a task-level blocking failure. Cite the exact controlled surface, relevant final scoring path, trust boundary, and evidence or missing runtime fact. Do not flag ordinary edits to source code, output files, or local tests unless they can manipulate trusted evaluation; agent-created outputs are normally the objects being evaluated. If the final grader reinstalls tests from a trusted independent copy, editing local tests alone is not exploitable. Exposure of answer material without modification of trusted scoring state belongs to ANSWER-LEAK; semantic acceptance of fabricated/self-reported results by an intact verifier belongs to VERIFIER-ACCEPTS-SHORTCUTS. This audit is orthogonal to semantic task failures and may coexist with any of them."
statuses = ["ISOLATED", "EXPOSED", "EXPLOITABLE", "UNKNOWN"]
blocking_statuses = ["EXPLOITABLE"]
