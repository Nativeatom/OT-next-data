[[criteria]]
name = "VERIFIER-ACCEPTS-INCOMPLETE"
description = "RIVER category: VERIFIER-TOO-WEAK / accepts incomplete work. Inspect tests/test.sh, tests/*, grader/verifier code, and scoring/reward code. Assign FAIL only when a concrete solution omitting a central, instruction-required capability can still receive full credit without modifying tests, the grader, or the scoring path. Identify the omitted capability, the verifier path that never checks it, and the evidence that the remaining checks still yield full reward. The fact that every requirement is not tested is insufficient by itself."

[[criteria]]
name = "VERIFIER-ACCEPTS-SHORTCUTS"
description = "RIVER category: VERIFIER-TOO-WEAK / accepts a shortcut. Assign FAIL only when the central task outcome can be fabricated, hardcoded, self-reported, or skipped while still receiving full credit. A shape/type/schema/count/file-existence check is a legitimate necessary check and does not establish weakness by itself. Likewise, a representation shortcut is acceptable if it still computes the requested result, and bypassing an auxiliary check is not enough if the central result is genuinely validated. Require a concrete shortcut or counterexample and cite the exact verifier/scoring path that accepts it; do not label merely because the verifier checks format or does not test every input."

[[criteria]]
name = "INSTR-VERIFIER-CONTRADICTION"
description = "RIVER category: INSTR-VERIFIER-MISMATCH / contradiction. Compare the agent-visible instruction and metadata with tests/test.sh and verifier assertions. Assign FAIL when a faithful solution to the literal instruction is rejected because the verifier uses a conflicting path, filename, value, hash, behavior, boundary convention, or format. Cite the instruction location, verifier location, and the concrete faithful solution that fails. Do not use this criterion for an extra requirement that is merely unstated; use INSTR-VERIFIER-UNSTATED-REQUIREMENT instead."

[[criteria]]
name = "INSTR-VERIFIER-UNSTATED-REQUIREMENT"
description = "RIVER category: INSTR-VERIFIER-MISMATCH / unstated requirement. Assign FAIL when the verifier imposes a necessary requirement that the agent cannot derive from the instruction, such as an exact string, key, ordering, path, tolerance, algorithmic mechanism, or side effect. Check instruction.md/README against the verifier and cite both locations. Explain why a reasonable instruction-following implementation would be rejected. Judge the agent-visible contract; tests/ and solution/ are verifier/reference evidence, not instruction text. A requirement directly implied by an explicit example, standard named by the task, or stated behavior is not unstated."

[[criteria]]
name = "INSTR-ENV-MISMATCH"
description = "RIVER category: INSTR-ENV-MISMATCH. Check Dockerfile/setup scripts, environment/, task files, and every referenced path, dependency, compiler, service, endpoint, GPU, GUI, or hardware requirement. Assign FAIL only when the instruction or verifier requires something that the supplied environment does not provide or cannot use, and completing the task would require inventing missing data or an assumed service/program. Cite the required item and the evidence of absence/incompatibility. Do not count verifier-only tests/reference files intentionally supplied after the agent stops, and do not flag software that can reasonably be installed or configured from available resources."

[[criteria]]
name = "INSTR-AMBIGUOUS"
description = "RIVER category: INSTR-AMBIGUOUS. Assign FAIL only when the agent-visible instruction omits a necessary specification, at least two interpretations are equally reasonable, those interpretations produce materially different outputs/behavior, and the verifier accepts only one. Identify the missing decision, give both plausible interpretations, and cite the verifier assertion that selects one. Exact wording, ordering, scope, boundary behavior, or format can qualify. Multiple valid implementation paths, ordinary domain-standard details, or a hard task do not qualify."

[[criteria]]
name = "TASK-TRIVIAL"
description = "RIVER category: TASK-TRIVIAL. Assign FAIL only when the task has essentially no meaningful work or learning signal, for example copying a supplied answer, echoing one value, or writing a constant independent of the inputs. Cite the minimal action and relevant files. Do not label a short but genuine debugging, implementation, data-processing, reasoning, or domain task as trivial."

[[criteria]]
name = "ANSWER-LEAK"
description = "RIVER category: ANSWER-LEAK. Inspect every agent-visible source of information: instruction.md for exact expected outputs, full patches, answer-determining commands or wording; environment/ and Dockerfile/setup for copied answer files, reference outputs, labels, oracle fixtures, caches, logs, history, or generated reference data; visible Git commits/branches/reflog/deleted files/commit messages; and runtime metadata, mounts, caches, or endpoints exposing the oracle. Assign FAIL only with an exact location/mechanism, the answer material exposed, how the agent can access it, and why it materially removes the required reasoning. A bug report, expected behavior, sample input, ordinary fixture, verifier-only test, or unavailable reference solution is not a leak."
